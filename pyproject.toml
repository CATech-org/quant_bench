[project]
name = "quant-bench"
version = "0.1.0"
description = "Benchmark 1-5 GGUF model quantizations on MMLU knowledge and aider's polyglot coding harness"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "lm-eval[api]>=0.4.9",
    "aider-chat==0.86.2",
    "transformers>=4.40",
    "pandas>=2.0",
    "lox>=0.3",
    "click>=8.1",
    "GitPython>=3.1",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "openai>=2.0",
    "imgcat>=0.6",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.scripts]
quant-bench = "quant_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/quant_bench/cli.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["click.option", "click.argument", "click.Path"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_bench"]
